# Include in the nginx http context. Apply the format in the Mirror HTTPS server.
map $uri $mirror_route {
    default unknown;
    /health health;
    /v1/sessions session_create;
    ~^/v1/sessions/[a-f0-9-]+/video[.]mp4$ media;
    ~^/v1/sessions/[a-f0-9-]+$ session;
    ~^/v1/subtitles/ subtitles;
    ~^/v1/credits/ credits;
    /v1/catalog catalog;
    /v1/ai/search ai_search;
    /v1/home-previews home_previews;
}

map "$mirror_route:$status" $mirror_log_request {
    default 1;
    "health:200" 0;
    ~^media:2[0-9][0-9]$ 0;
}

log_format mirror_diagnostics escape=json
    '{"timestamp":"$time_iso8601","schema_version":1,"service":"ingress",'
    '"event":"request_completed","request_id":"$request_id","route":"$mirror_route",'
    '"status":$status,"request_time_s":$request_time,'
    '"upstream_status":"$upstream_status","upstream_time_s":"$upstream_response_time"}';
