name: CI
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  security:
    name: Security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@dcedce43c6f43de0b836d1fe38946645c9c638dc # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: false
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: false
      - run: python3 scripts/check-repository.py
  server:
    name: Server tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/streaming
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: services/streaming/package-lock.json
      - run: npm ci --omit=optional
      - run: npm test
      - run: docker build -t mirror-streaming:ci .
  ios:
    name: iOS build and tests
    runs-on: macos-15
    timeout-minutes: 45
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      - run: brew install xcodegen
      - run: npm install --global firebase-tools@14.12.0
      - run: python3 scripts/bootstrap-ios.py --ci
      - run: xcodegen generate --spec apps/ios/project.yml --project apps/ios
      - name: Select a CI simulator
        run: |
          device=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; print(next(d["udid"] for group in json.load(sys.stdin)["devices"].values() for d in group if d["name"].startswith("iPhone")))')
          echo "IOS_DESTINATION=platform=iOS Simulator,id=$device" >> "$GITHUB_ENV"
      - run: bash scripts/test-ios.sh > ios-tests.log 2>&1
      - name: Release simulator build
        run: xcodebuild -quiet -project apps/ios/Mirror.xcodeproj -scheme Mirror -configuration Release -destination "$IOS_DESTINATION" CODE_SIGNING_ALLOWED=NO build
      - name: Print test failures
        if: failure()
        run: tail -150 ios-tests.log || true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: ios-test-logs
          path: ios-tests.log
          retention-days: 7
  macos:
    name: macOS build and tests
    runs-on: macos-15
    timeout-minutes: 45
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.1.1.app/Contents/Developer
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      - run: brew install xcodegen
      - run: npm install --global firebase-tools@14.12.0
      - run: python3 scripts/bootstrap-ios.py --ci --platform macos
      - run: xcodegen generate --spec apps/macos/project.yml --project apps/macos
      - run: bash scripts/test-macos.sh > macos-tests.log 2>&1
      - name: Release macOS build
        run: xcodebuild -quiet -project apps/macos/MirrorDesktop.xcodeproj -scheme MirrorDesktop -configuration Release -destination 'platform=macOS' CODE_SIGN_IDENTITY=- DEVELOPMENT_TEAM= CODE_SIGN_ENTITLEMENTS= build
      - name: Print macOS test failures
        if: failure()
        run: tail -150 macos-tests.log || true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: macos-test-logs
          path: macos-tests.log
          retention-days: 7
  promotion:
    name: Develop to main
    runs-on: ubuntu-latest
    steps:
      - name: Require develop for main pull requests
        env:
          BASE: ${{ github.base_ref }}
          HEAD: ${{ github.head_ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" = pull_request ] && [ "$BASE" = main ]; then
            test "$HEAD" = develop && test "$HEAD_REPO" = "$REPO"
          fi
