name: CI
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [security, server, ios, macos, promotion]
    uses: ./.github/workflows/release-macos.yml
    permissions:
      contents: write
      actions: read
      pull-requests: read
    secrets: inherit
  security:
    name: Security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: false
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: false
      - run: python3 scripts/check-repository.py
      - run: python3 -m unittest discover -s scripts -p 'test_macos_release.py'
  server:
    name: Server tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/streaming
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: services/streaming/package-lock.json
      - run: npm ci --omit=optional
      - run: npm test
      - run: docker build -t mirror-streaming:ci .
  ios:
    name: iOS build and tests
    runs-on: macos-15
    timeout-minutes: 45
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '21'
      - run: brew install xcodegen
      - run: npm install --global firebase-tools@14.12.0
      - run: python3 scripts/bootstrap-ios.py --ci
      - run: xcodegen generate --spec apps/ios/project.yml --project apps/ios
      - name: Select a CI simulator
        run: |
          device=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; print(next(d["udid"] for group in json.load(sys.stdin)["devices"].values() for d in group if d["name"].startswith("iPhone")))')
          echo "IOS_DESTINATION=platform=iOS Simulator,id=$device" >> "$GITHUB_ENV"
      - run: bash scripts/test-ios.sh > ios-tests.log 2>&1
      - name: Release simulator build
        run: xcodebuild -quiet -project apps/ios/Mirror.xcodeproj -scheme Mirror -configuration Release -destination "$IOS_DESTINATION" CODE_SIGNING_ALLOWED=NO build
      - name: Print test failures
        if: failure()
        run: tail -150 ios-tests.log || true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: ios-test-logs
          path: ios-tests.log
          retention-days: 7
  macos:
    name: macOS build and tests
    runs-on: macos-15
    timeout-minutes: 45
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.1.1.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '21'
      - run: brew install xcodegen
      - run: npm install --global firebase-tools@14.12.0
      - run: python3 scripts/bootstrap-ios.py --ci --platform macos
      - run: xcodegen generate --spec apps/macos/project.yml --project apps/macos
      - run: bash scripts/test-macos.sh > macos-tests.log 2>&1
      - name: Portable macOS authentication and playback tests
        run: bash scripts/build-macos-adhoc.sh test > macos-portable-tests.log 2>&1
      - name: Release macOS build
        run: xcodebuild -quiet -project apps/macos/MirrorDesktop.xcodeproj -scheme MirrorDesktop -configuration Release -destination 'platform=macOS' CODE_SIGN_IDENTITY=- DEVELOPMENT_TEAM= CODE_SIGN_ENTITLEMENTS= build
      - name: Print macOS test failures
        if: failure()
        run: |
          tail -100 macos-tests.log || true
          tail -100 macos-portable-tests.log || true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: macos-test-logs
          path: |
            macos-tests.log
            macos-portable-tests.log
          retention-days: 7
  promotion:
    name: Develop to main
    runs-on: ubuntu-latest
    steps:
      - name: Require develop for main pull requests
        env:
          BASE: ${{ github.base_ref }}
          HEAD: ${{ github.head_ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" = pull_request ] && [ "$BASE" = main ]; then
            test "$HEAD" = develop && test "$HEAD_REPO" = "$REPO"
          fi
