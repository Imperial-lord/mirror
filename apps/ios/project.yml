name: Mirror
options:
  bundleIdPrefix: com.mirror
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true

packages:
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS.git
    from: 8.0.0
  Nuke:
    url: https://github.com/kean/Nuke.git
    from: 12.8.0
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk.git
    from: 11.0.0

targets:
  Mirror:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Mirror
        excludes:
          - Core/Torrent
      - path: Config/GoogleService-Info.plist
        buildPhase: resources
    settings:
      base:
        INFOPLIST_FILE: Mirror/Info.plist
        SWIFT_VERSION: "5.9"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_USER_SCRIPT_SANDBOXING: false
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: "1.0.0"
        TARGETED_DEVICE_FAMILY: "1"
    configFiles:
      Debug: Config/Base.xcconfig
      Release: Config/Base.xcconfig
    dependencies:
      - package: GoogleSignIn
        product: GoogleSignIn
      - package: Nuke
        product: Nuke
      - package: Nuke
        product: NukeUI
      - package: Firebase
        product: FirebaseFirestore
      - package: Firebase
        product: FirebaseAuth
  MirrorTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: MirrorTests
        excludes:
          - TorrentPlaybackTests.swift
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.9"
    dependencies:
      - target: Mirror

schemes:
  Mirror:
    build:
      targets:
        Mirror: all
    test:
      targets:
        - MirrorTests
      gatherCoverageData: false
    run:
      config: Debug
    archive:
      config: Release
